<div id="powder-overlay">
  <div id="powder-panel">
    <div id="powder-title">Powder</div>
    <div id="powder-palette">
      <button data-mat="1" title="Sand (1)"><span class="swatch" style="background:#d2b06c"></span>Sand</button>
      <button data-mat="2" title="Water (2)"><span class="swatch" style="background:#3084c4"></span>Water</button>
      <button data-mat="3" title="Wet Sand (3)"><span class="swatch" style="background:#846640"></span>Wet Sand</button>
      <button data-mat="4" title="Gold (4)"><span class="swatch" style="background:#ecbc34"></span>Gold</button>
      <button data-mat="5" title="Residue (5)"><span class="swatch" style="background:#6c6656"></span>Residue</button>
      <button data-mat="6" title="Dirt (6)"><span class="swatch" style="background:#5c3a20"></span>Dirt</button>
      <button data-mat="7" title="Stone (7)"><span class="swatch" style="background:#626870"></span>Stone</button>
      <button data-mat="8" title="Lava (8)"><span class="swatch" style="background:#e84e16"></span>Lava</button>
      <button data-mat="9" title="Steam (9)"><span class="swatch" style="background:#c6d0d8"></span>Steam</button>
      <button data-mat="11" title="Shaker (0)"><span class="swatch" style="background:#b09448"></span>Shaker</button>
      <button data-mat="0" title="Erase (X)"><span class="swatch" style="background:#1a1c22; outline:1px solid #555"></span>Erase</button>
    </div>
    <div id="powder-stats">
      <div>Material: <span id="powder-material"></span></div>
      <div>Brush: <span id="powder-brush"></span></div>
      <div>Active: <span id="powder-count"></span></div>
      <div id="powder-debug"></div>
      <div id="powder-paused">PAUSED</div>
    </div>
  </div>
  <div id="powder-help">
    RMB = break (pixels FALL, they are not deleted)<br />
    Dirt → Sand · Stone/Gold/Sand start falling · X paints erase<br />
    LMB paints · V cyan = currently falling · P pause · R regen
  </div>
</div>
