<div id="player-overlay">
  <div id="player-panel">
    <div id="player-title">Prospector</div>
    <div>Cargo: <span id="player-cargo"></span></div>
    <div>State: <span id="player-state"></span></div>
    <div id="player-wrong"></div>
  </div>
  <div id="player-hotbar">
    <button type="button" data-slot="0">
      <span class="hotbar-key">1</span>
      <span class="hotbar-swatch" style="background:#c4a35a"></span>
      <span class="hotbar-name">Schaufel</span>
    </button>
    <button type="button" data-slot="1">
      <span class="hotbar-key">2</span>
      <span class="hotbar-swatch" style="background:#8a93a0"></span>
      <span class="hotbar-name">Steinbohrer</span>
    </button>
  </div>
  <div id="player-help">
    1 Schaufel (Dirt, Sand) · 2 Steinbohrer (Stone)<br />
    LMB uses selected tool in range · RMB haul loose pixels<br />
    A/D walk · W jump · S crouch
  </div>
</div>
